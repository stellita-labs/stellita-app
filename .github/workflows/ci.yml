name: ci
on:
  push:
    branches:
    - main
  pull_request: null
jobs:
  verify:
    runs-on: ubuntu-latest
    # 15 min cap: GitHub's default is 360, and a hung install/toolchain step
    # would otherwise pin a runner for hours before anyone is notified.
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - uses: pnpm/action-setup@v4
      with:
        version: 10.21.0
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm
    - name: Install dependencies
      # 10 min cap: the registry/network fetch is the most likely step to hang.
      timeout-minutes: 10
      run: pnpm install --frozen-lockfile
    - name: Typecheck
      run: pnpm typecheck
    - name: Build client bundle
      run: pnpm build
    - name: Check bundle budget
      run: pnpm check:bundle
    - name: Check forbidden patterns
      run: pnpm check:forbidden-patterns
  migrations:
    runs-on: ubuntu-latest
    # 15 min cap: GitHub's default is 360, and a hung install/toolchain step
    # would otherwise pin a runner for hours before anyone is notified.
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - uses: pnpm/action-setup@v4
      with:
        version: 10.21.0
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm
    - name: Install dependencies
      # 10 min cap: the registry/network fetch is the most likely step to hang.
      timeout-minutes: 10
      run: pnpm install --frozen-lockfile
    - name: Run migration tests
      run: pnpm test:migrations
  security:
    runs-on: ubuntu-latest
    # 15 min cap: GitHub's default is 360, and a hung install/toolchain step
    # would otherwise pin a runner for hours before anyone is notified.
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - uses: pnpm/action-setup@v4
      with:
        version: 10.21.0
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm
    - name: Install dependencies
      # 10 min cap: the registry/network fetch is the most likely step to hang.
      timeout-minutes: 10
      run: pnpm install --frozen-lockfile
    - name: Check env.example secrets
      run: pnpm check:env
