name: ci
on:
  push:
    branches:
    - main
  pull_request: null
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - uses: pnpm/action-setup@v4
      with:
        version: 10.21.0
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
    - name: Typecheck
      run: pnpm typecheck
    - name: Build client bundle
      run: pnpm build
    - name: Check bundle budget
      run: pnpm check:bundle
    - name: Check forbidden patterns
      run: pnpm check:forbidden-patterns
  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - uses: pnpm/action-setup@v4
      with:
        version: 10.21.0
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
    - name: Run migration tests
      run: pnpm test:migrations
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - uses: pnpm/action-setup@v4
      with:
        version: 10.21.0
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
    - name: Check env.example secrets
      run: pnpm check:env
  ci-ok:
    name: ci-ok
    if: always()
    needs: [verify, migrations, security]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Fail unless every required job succeeded
      env:
        NEEDS: ${{ toJSON(needs) }}
      run: |
        set -euo pipefail
        echo "Dependency results:"
        echo "$NEEDS" | jq -r 'to_entries[] | "  \(.key): \(.value.result)"'
        failed="$(echo "$NEEDS" | jq -r 'to_entries[] | select(.value.result != "success") | .key' | tr '\n' ' ')"
        if [ -n "$failed" ]; then
          echo "::error::These required jobs did not succeed: $failed"
          exit 1
        fi
        echo "All required jobs succeeded."
