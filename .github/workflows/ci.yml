name: ci
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
on:
  push:
    branches:
    - main
  pull_request: null
  schedule:
  - cron: 0 * * * *
  workflow_dispatch: null
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      with:
        version: 10.21.0
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 22
        cache: pnpm
    - name: Install dependencies
      timeout-minutes: 10
      run: pnpm install --frozen-lockfile
    - name: Typecheck
      run: pnpm typecheck
    - name: Lint
      run: pnpm lint
    - name: Build client bundle
      run: pnpm build
    - name: Check bundle budget
      run: pnpm check:bundle
    - name: Check forbidden patterns
      run: pnpm check:forbidden-patterns
    - name: Check env.example against process.env reads
      run: pnpm check:env
    - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      with:
        version: 10.21.0
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
      with:
        node-version: 22
        cache: pnpm
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - uses: actions/checkout@v4
    - uses: pnpm/action-setup@v4
      with:
        version: 10.21.0
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
    - name: Test
      run: pnpm test
    - name: Server boot smoke test
      run: pnpm smoke:server
    - name: Lint (zero warnings)
      run: pnpm lint
  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      with:
        version: 10.21.0
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 22
        cache: pnpm
    - name: Install dependencies
      timeout-minutes: 10
      run: pnpm install --frozen-lockfile
    - name: Lint migrations (ordering + destructive DDL)
      run: pnpm check:migrations
    - name: Run migration tests
      run: pnpm test:migrations
    - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      with:
        version: 10.21.0
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
      with:
        node-version: 22
        cache: pnpm
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - uses: pnpm/action-setup@v4
      with:
        version: 10.21.0
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
    - name: Run unit tests
      run: pnpm test
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      with:
        version: 10.21.0
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 22
        cache: pnpm
    - name: Install dependencies
      timeout-minutes: 10
      run: pnpm install --frozen-lockfile
    - name: Check env.example secrets
      run: pnpm check:env
    - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      with:
        version: 10.21.0
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
      with:
        node-version: 22
        cache: pnpm
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
  typecheck-server:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - uses: pnpm/action-setup@v6
      with:
        version: 10.21.0
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
    - name: Typecheck the server project
      run: pnpm exec tsc -p server/tsconfig.json --noEmit
    - uses: pnpm/action-setup@v4
      with:
        version: 10.21.0
    - uses: actions/setup-node@v6
      with:
        node-version: 22
        cache: pnpm
    - uses: actions/checkout@v7
  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: pnpm/action-setup@v4
      with:
        version: 10.21.0
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
    - name: Validate commit messages
      run: pnpm check:commits
      env:
        COMMIT_FROM: ${{ github.event.pull_request.base.sha }}
        COMMIT_TO: ${{ github.event.pull_request.head.sha }}
  network:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      STELLAR_RPC_URL: https://soroban-testnet.stellar.org
    steps:
    - uses: actions/checkout@v4
    - uses: pnpm/action-setup@v4
      with:
        version: 10.21.0
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
    - name: Probe testnet RPC and Friendbot
      run: pnpm check:network
  ci-ok:
    name: ci-ok
    if: always()
    needs:
    - verify
    - migrations
    - security
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Fail unless every required job succeeded
      env:
        NEEDS: ${{ toJSON(needs) }}
      run: "set -euo pipefail\necho \"Dependency results:\"\necho \"$NEEDS\" | jq\
        \ -r 'to_entries[] | \"  \\(.key): \\(.value.result)\"'\nfailed=\"$(echo \"\
        $NEEDS\" | jq -r 'to_entries[] | select(.value.result != \"success\") | .key'\
        \ | tr '\\n' ' ')\"\nif [ -n \"$failed\" ]; then\n  echo \"::error::These\
        \ required jobs did not succeed: $failed\"\n  exit 1\nfi\necho \"All required\
        \ jobs succeeded.\"\n"
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - uses: pnpm/action-setup@v4
      with:
        version: 10.21.0
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
    - name: Validate contract manifests
      run: pnpm check:manifests
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docker: ${{ steps.filter.outputs.docker }}
    steps:
    - uses: actions/checkout@v4
    - uses: dorny/paths-filter@v3
      id: filter
      with:
        filters: "docker:\n  - 'Dockerfile'\n  - 'Dockerfile.*'\n  - 'nginx.web.conf'\n\
          \  - 'package.json'\n  - 'pnpm-lock.yaml'\n  - 'tsconfig.json'\n  - 'tsconfig.app.json'\n\
          \  - 'tsconfig.node.json'\n"
  docker:
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - uses: docker/setup-buildx-action@v3
    - name: Build the API image (Dockerfile)
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./Dockerfile
        push: false
        cache-from: type=gha
        cache-to: type=gha,mode=max
    - name: Build the web image (Dockerfile.web)
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./Dockerfile.web
        push: false
        build-args: 'VITE_API_BASE=https://api.stellita.app

          '
        cache-from: type=gha
        cache-to: type=gha,mode=max
