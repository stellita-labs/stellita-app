name: ci
concurrency:
  # Unique per workflow+ref, so a different workflow never cancels this one.
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded runs on branches/PRs, but never on main.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
on:
  push:
    branches:
    - main
  pull_request: null
jobs:
  verify:
    runs-on: ubuntu-latest
    # 15 min cap: GitHub's default is 360, and a hung install/toolchain step
    # would otherwise pin a runner for hours before anyone is notified.
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      with:
        version: 10.21.0
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: 22
        cache: pnpm
    - name: Install dependencies
      # 10 min cap: the registry/network fetch is the most likely step to hang.
      timeout-minutes: 10
      run: pnpm install --frozen-lockfile
    - name: Typecheck
      run: pnpm typecheck
    - name: Lint
      run: pnpm lint
    - name: Build client bundle
      run: pnpm build
    - name: Check bundle budget
      run: pnpm check:bundle
    - name: Check forbidden patterns
      run: pnpm check:forbidden-patterns
    - name: Check env.example against process.env reads
      run: pnpm check:env
  migrations:
    runs-on: ubuntu-latest
    # 15 min cap: GitHub's default is 360, and a hung install/toolchain step
    # would otherwise pin a runner for hours before anyone is notified.
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      with:
        version: 10.21.0
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: 22
        cache: pnpm
    - name: Install dependencies
      # 10 min cap: the registry/network fetch is the most likely step to hang.
      timeout-minutes: 10
      run: pnpm install --frozen-lockfile
    - name: Lint migrations (ordering + destructive DDL)
      run: pnpm check:migrations
    - name: Run migration tests
      run: pnpm test:migrations
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - uses: pnpm/action-setup@v4
      with:
        version: 10.21.0
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
    - name: Run unit tests
      run: pnpm test
  security:
    runs-on: ubuntu-latest
    # 15 min cap: GitHub's default is 360, and a hung install/toolchain step
    # would otherwise pin a runner for hours before anyone is notified.
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      with:
        version: 10.21.0
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: 22
        cache: pnpm
    - name: Install dependencies
      # 10 min cap: the registry/network fetch is the most likely step to hang.
      timeout-minutes: 10
      run: pnpm install --frozen-lockfile
    - name: Check env.example secrets
      run: pnpm check:env
  typecheck-server:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - uses: pnpm/action-setup@v4
      with:
        version: 10.21.0
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
    - name: Typecheck the server project
      run: pnpm exec tsc -p server/tsconfig.json --noEmit
