name: ci
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
on:
  push:
    branches:
    - main
  pull_request: null
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      with:
        version: 10.21.0
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 22
        cache: pnpm
    - name: Install dependencies
      timeout-minutes: 10
      run: pnpm install --frozen-lockfile
    - name: Typecheck
      run: pnpm typecheck
    - name: Lint
      run: pnpm lint
    - name: Build client bundle
      run: pnpm build
    - name: Check bundle budget
      run: pnpm check:bundle
    - name: Check forbidden patterns
      run: pnpm check:forbidden-patterns
    - name: Check env.example against process.env reads
      run: pnpm check:env
    - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      with:
        version: 10.21.0
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
      with:
        node-version: 22
        cache: pnpm
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      with:
        version: 10.21.0
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 22
        cache: pnpm
    - name: Install dependencies
      timeout-minutes: 10
      run: pnpm install --frozen-lockfile
    - name: Lint migrations (ordering + destructive DDL)
      run: pnpm check:migrations
    - name: Run migration tests
      run: pnpm test:migrations
    - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      with:
        version: 10.21.0
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
      with:
        node-version: 22
        cache: pnpm
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - uses: pnpm/action-setup@v6
      with:
        version: 10.21.0
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
    - name: Run unit tests
      run: pnpm test
    - uses: pnpm/action-setup@v4
      with:
        version: 10.21.0
    - uses: actions/setup-node@v6
      with:
        node-version: 22
        cache: pnpm
    - uses: actions/checkout@v7
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      with:
        version: 10.21.0
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 22
        cache: pnpm
    - name: Install dependencies
      timeout-minutes: 10
      run: pnpm install --frozen-lockfile
    - name: Check env.example secrets
      run: pnpm check:env
    - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      with:
        version: 10.21.0
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
      with:
        node-version: 22
        cache: pnpm
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
  typecheck-server:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - uses: pnpm/action-setup@v6
      with:
        version: 10.21.0
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
    - name: Typecheck the server project
      run: pnpm exec tsc -p server/tsconfig.json --noEmit
    - uses: pnpm/action-setup@v4
      with:
        version: 10.21.0
    - uses: actions/setup-node@v6
      with:
        node-version: 22
        cache: pnpm
    - uses: actions/checkout@v7
